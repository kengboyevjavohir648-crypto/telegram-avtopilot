name: Telegram avtopilot

on:
  schedule:
    - cron: "*/15 * * * *"   # har 15 daqiqada (GitHub ba'zan 5-15 daqiqa kechiktiradi)
  workflow_dispatch:          # Actions sahifasidan qo'lda ishga tushirish

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Botni ishga tushirish
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "telegram-avtopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "holat yangilandi" && git push)
